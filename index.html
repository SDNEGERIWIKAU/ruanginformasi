<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Digital SDN Wikau</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #059669;
            --crystal: #f9fafb;
            --soft-gray: #e5e7eb;
            --glass-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--crystal);
            color: #1f2937;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }

        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(at 0% 0%, rgba(5, 150, 105, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            z-index: -1;
        }

        .glass-nav {
            background: rgba(249, 250, 251, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(5, 150, 105, 0.1);
        }

        .bento-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .bento-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(5, 150, 105, 0.1);
            border-color: var(--emerald);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--emerald);
            border-radius: 10px;
        }

        .animate-fade-up {
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .shimmer-btn:hover::after { left: 100%; top: 100%; }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="mesh-gradient"></div>

    <!-- Navbar -->
    <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold text-emerald-700 tracking-tight">SDN WIKAU</h1>
                <p class="text-[10px] uppercase tracking-widest text-emerald-600 font-bold">Portal Digital Sekolah</p>
            </div>
            <div class="hidden md:flex gap-8 text-sm font-semibold text-gray-600">
                <a href="#karya" class="hover:text-emerald-600 transition">Karya Siswa</a>
                <a href="#berita" class="hover:text-emerald-600 transition">Warta Sekolah</a>
                <a href="#profil" class="hover:text-emerald-600 transition">Profil Kami</a>
            </div>
            <button class="md:hidden text-emerald-700">☰</button>
        </div>
    </nav>

    <!-- Hero -->
    <header class="max-w-7xl mx-auto px-6 pt-20 pb-12 text-center animate-fade-up">
        <h2 class="text-5xl md:text-7xl font-extrabold mb-6 text-gray-900 leading-tight">
            Merawat Ilmu, <span class="text-emerald-600 italic">Menebar Inspirasi.</span>
        </h2>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto mb-10">
            Terwujudnya peserta didik yang berakhlak mulia, berpikir kritis, kreatif, dan peduli lingkungan.
        </p>
        
        <!-- Search & Filter -->
        <div class="flex flex-wrap justify-center gap-4 bg-white/50 p-4 rounded-3xl backdrop-blur-md border border-white max-w-3xl mx-auto shadow-sm">
            <select id="filterKategori" onchange="fetchData()" class="bg-transparent font-semibold text-emerald-800 outline-none p-2 cursor-pointer">
                <option value="Semua">Semua Kategori</option>
                <option value="Game Interaktif">Game Interaktif</option>
                <option value="Video Pembelajaran">Video</option>
                <option value="Berita">Warta Berita</option>
                <option value="Profil">Profil</option>
            </select>
            <select id="filterKelas" onchange="fetchData()" class="bg-transparent font-semibold text-emerald-800 outline-none p-2 cursor-pointer border-l border-emerald-100 pl-4">
                <option value="Semua">Semua Kelas</option>
                <option value="Kelas 1">Kelas 1</option>
                <option value="Kelas 2">Kelas 2</option>
                <option value="Kelas 3">Kelas 3</option>
                <option value="Kelas 4">Kelas 4</option>
                <option value="Kelas 5">Kelas 5</option>
                <option value="Kelas 6">Kelas 6</option>
            </select>
        </div>
    </header>

    <!-- Bento Grid -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <div id="gridKarya" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Data akan dimuat di sini -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-20 border-t border-emerald-100 py-12 px-6 bg-white/30 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <p class="text-sm text-gray-500 font-medium">© 2024 | SDN WIKAU oleh Bapak Ranto</p>
                <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest">Support by <a href="https://mfytech.my.id/" class="hover:text-emerald-500">MfyTech</a></p>
            </div>
            <div class="flex gap-6">
                <!-- Sosial Media Ikon Sederhana -->
                <a href="#" class="text-gray-400 hover:text-blue-600 transition font-bold">FB</a>
                <a href="#" class="text-gray-400 hover:text-pink-600 transition font-bold">IG</a>
                <a href="#" class="text-gray-400 hover:text-black transition font-bold">TK</a>
                <a href="#" class="text-gray-400 hover:text-red-600 transition font-bold">YT</a>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxuvbJHIS5CkXwWRupMc_StuDjExhwjUZgruMoQkWnccy3RM8290WGf7dBW4BPOJNi8jg/exec"; // MASUKKAN URL WEB APP ANDA DI SINI
        const API_TOKEN = "WIKAU_SAKTI_2024";

        async function fetchData() {
            const kat = document.getElementById('filterKategori').value;
            const kls = document.getElementById('filterKelas').value;
            const grid = document.getElementById('gridKarya');
            
            grid.innerHTML = '<div class="col-span-full py-20 text-center text-emerald-600 font-bold animate-pulse">Menghimpun inspirasi...</div>';

            try {
                let url = `${API_URL}?token=${API_TOKEN}&kategori=${kat}&kelas=${kls}`;
                const response = await fetch(url, { redirect: 'follow' });
                const data = await response.json();
                renderCards(data);
            } catch (err) {
                console.error("Gagal memuat API, menggunakan data cadangan.");
                renderCards(dummyData);
            }
        }

        function renderCards(data) {
            const grid = document.getElementById('gridKarya');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-400 font-medium italic">Oops! Belum ada karya di sini, ayo mulai berkarya!</div>';
                return;
            }

            data.forEach((item, index) => {
                // Memberikan efek Bento Grid (variasi ukuran)
                const isFeatured = index % 5 === 0;
                const card = document.createElement('div');
                card.className = `bento-card group animate-fade-up ${isFeatured ? 'md:col-span-2 md:row-span-2' : ''}`;
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="relative h-48 md:h-full min-h-[200px] overflow-hidden">
                        <img src="${item.Link_Thumbnail}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="${item.Judul_Karya}">
                        <div class="absolute inset-0 bg-gradient-to-t from-emerald-900/80 via-transparent to-transparent"></div>
                        <div class="absolute top-4 left-4 flex gap-2">
                            <span class="px-3 py-1 bg-white/20 backdrop-blur-md text-[10px] font-bold text-white uppercase rounded-full border border-white/30">${item.Kategori}</span>
                        </div>
                    </div>
                    <div class="p-6 relative bg-white/40">
                        <p class="text-[10px] text-emerald-600 font-extrabold uppercase tracking-widest mb-1">${item.Mata_Pelajaran} • ${item.Kelas}</p>
                        <h3 class="text-xl font-bold text-gray-800 mb-2 leading-tight">${item.Judul_Karya}</h3>
                        <p class="text-sm text-gray-600 mb-6 line-clamp-2">${item.Deskripsi}</p>
                        <a href="${item.Link_Media}" target="_blank" class="shimmer-btn inline-block w-full py-3 bg-emerald-600 text-white text-center rounded-xl font-bold hover:bg-emerald-700 transition-colors">Akses Sekarang</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        const dummyData = [
            { Judul_Karya: "Inovasi Daur Ulang", Kategori: "Video Pembelajaran", Mata_Pelajaran: "IPA", Kelas: "Kelas 4, 5", Link_Thumbnail: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=800", Deskripsi: "Siswa kelas 5 mendemonstrasikan cara mengubah sampah plastik menjadi pot bunga cantik.", Link_Media: "#" },
            { Judul_Karya: "Kuis Pancasila", Kategori: "Game Interaktif", Mata_Pelajaran: "PPKN", Kelas: "Kelas 3", Link_Thumbnail: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=800", Deskripsi: "Asah kemampuanmu tentang nilai-nilai luhur Pancasila dengan permainan seru ini.", Link_Media: "#" },
            { Judul_Karya: "Galeri Lukis Alam", Kategori: "Karya Seni", Mata_Pelajaran: "SBdP", Kelas: "Semua Kelas", Link_Thumbnail: "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?q=80&w=800", Deskripsi: "Kumpulan lukisan bertema lingkungan karya siswa SDN Wikau.", Link_Media: "#" }
        ];

        window.onload = fetchData;

        // Anti-Inspect Simple
        document.addEventListener('contextmenu', e => e.preventDefault());
        console.log("%cHalo Pak Ranto! %cPortal SDN Wikau terjaga dengan aman.", "color: #059669; font-size: 20px; font-weight: bold;", "color: #gray;");
    </script>
</body>
</html>
